<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Wajah Siswa - Presensi Madrasah</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Pustaka face-api.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .camera-container { position: relative; width: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; border-radius: 12px; background: #212529; min-height: 250px; }
    img { width: 100%; height: auto; display: block; object-fit: cover; }
    .status-badge { position: absolute; top: 10px; left: 10px; z-index: 10; }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white text-center py-3">
          <h4 class="mb-0">Pendaftaran Presensi Wajah</h4>
          <small>Sistem Presensi Siswa Madrasah</small>
        </div>
        <div class="card-body p-4">
          
          <!-- Tombol Buka Kamera Native HP Android -->
          <div class="mb-3">
            <label for="nativeCameraInput" class="btn btn-success btn-lg w-100 py-3 fw-bold shadow-sm">
              📸 Ambil Foto Wajah Siswa
            </label>
            <!-- Input Kamera Native HP -->
            <input type="file" id="nativeCameraInput" accept="image/*" capture="user" style="display: none;" onchange="handleImageEnrollment(event)">
            <div class="form-text text-center text-muted small mt-2">Ketuk tombol hijau di atas untuk membuka kamera HP Android.</div>
          </div>

          <!-- Pratinjau Gambar -->
          <div class="camera-container mb-3 text-center d-flex align-items-center justify-content-center">
            <span id="cameraStatus" class="badge bg-warning text-dark status-badge">Memuat Model AI...</span>
            <img id="imagePreview" src="data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22300%22%20height%3D%22200%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23212529%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3EFoto%20Siswa%20Akan%20Tampil%20Di%20Sini%3C%2Ftext%3E%3C%2Fsvg%3E" alt="Pratinjau Foto">
          </div>

          <!-- Form Data Siswa -->
          <form id="enrollForm">
            <div class="mb-3">
              <label for="nis" class="form-label fw-bold">NIS / NISN</label>
              <input type="number" class="form-control" id="nis" required placeholder="Masukkan NIS siswa">
            </div>
            
            <div class="mb-3">
              <label for="nama" class="form-label fw-bold">Nama Lengkap Siswa</label>
              <input type="text" class="form-control" id="nama" required placeholder="Masukkan nama lengkap">
            </div>

            <div class="mb-3">
              <label for="kelas" class="form-label fw-bold">Kelas</label>
              <input type="text" class="form-control" id="kelas" required placeholder="Contoh: VII-A, X-IPA-1">
            </div>

            <div class="mb-3">
              <label for="emailOrtu" class="form-label fw-bold">Email Orang Tua</label>
              <input type="email" class="form-control" id="emailOrtu" required placeholder="email@gmail.com">
            </div>

            <div class="mb-3">
              <label for="waOrtu" class="form-label fw-bold">Nomor WhatsApp Orang Tua</label>
              <input type="tel" class="form-control" id="waOrtu" required placeholder="628123456789">
              <div class="form-text">Gunakan format kode negara (contoh: 628123456789).</div>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-2 fw-bold" disabled>
              Simpan & Daftarkan Wajah
            </button>
          </form>

          <!-- Status Alert -->
          <div id="alertBox" class="mt-3" style="display: none;"></div>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // CONFIGURATION: Ganti dengan URL Deployment Web App Google Apps Script Anda
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwRT4Bw2Z_d-P0TmxGSAZHSV3xncTjj9eC5sY8vo43apsWw-j-CUA6LT8IAUzm0l2HkQg/exec";
  const MODEL_URL = "https://justadudewhohacks.github.io/face-api.js/models";

  const imagePreview = document.getElementById("imagePreview");
  const cameraStatus = document.getElementById("cameraStatus");
  const btnSubmit = document.getElementById("btnSubmit");
  const alertBox = document.getElementById("alertBox");

  let capturedDescriptor = null;

  // 1. Memuat Model AI face-api.js
  async function loadModels() {
    try {
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
      cameraStatus.className = "badge bg-success status-badge";
      cameraStatus.innerText = "Model AI Siap";
      btnSubmit.disabled = false;
    } catch (err) {
      showAlert("danger", "Gagal memuat model AI: " + err.message);
    }
  }

  // 2. Memproses Foto Wajah dari Kamera Native HP
  function handleImageEnrollment(event) {
    const file = event.target.files[0];
    if (!file) return;

    btnSubmit.disabled = true;
    showAlert("info", "Membaca foto dan menganalisis wajah...");

    const reader = new FileReader();
    reader.onload = function (e) {
      const imgDataUrl = e.target.result;
      imagePreview.src = imgDataUrl;

      // Buat elemen gambar baru untuk dianalisis oleh AI
      const img = new Image();
      img.src = imgDataUrl;
      img.onload = async () => {
        try {
          const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();

          if (!detection) {
            showAlert("danger", "Wajah tidak terdeteksi! Pastikan foto diambil dari jarak dekat dengan posisi wajah terlihat jelas.");
            capturedDescriptor = null;
            btnSubmit.disabled = false;
            return;
          }

          capturedDescriptor = Array.from(detection.descriptor);
          showAlert("success", "✅ Wajah berhasil terdeteksi! Silakan isi form lalu klik tombol Simpan.");
          btnSubmit.disabled = false;
        } catch (err) {
          showAlert("danger", "Gagal mengekstrak data wajah: " + err.message);
          btnSubmit.disabled = false;
        }
      };
    };

    reader.readAsDataURL(file);
  }

  // 3. Mengirimkan Data Pendaftaran ke Google Apps Script
  document.getElementById("enrollForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!capturedDescriptor) {
      showAlert("warning", "Harap ambil foto wajah siswa terlebih dahulu menggunakan tombol hijau di atas!");
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> Menyimpan Data...`;

    const payload = {
      action: "enroll",
      nis: document.getElementById("nis").value,
      nama: document.getElementById("nama").value,
      kelas: document.getElementById("kelas").value,
      emailOrtu: document.getElementById("emailOrtu").value,
      waOrtu: document.getElementById("waOrtu").value,
      descriptors: capturedDescriptor
    };

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === "success") {
        showAlert("success", "🎉 " + result.message);
        document.getElementById("enrollForm").reset();
        capturedDescriptor = null;
        imagePreview.src = "data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22300%22%20height%3D%22200%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23212529%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3EFoto%20Siswa%20Akan%20Tampil%20Di%20Sini%3C%2Ftext%3E%3C%2Fsvg%3E";
      } else {
        showAlert("danger", "Gagal mendaftar: " + result.message);
      }
    } catch (err) {
      showAlert("danger", "Kesalahan koneksi ke server: " + err.message);
    } finally {
      resetButton();
    }
  });

  function showAlert(type, message) {
    alertBox.className = `alert alert-${type}`;
    alertBox.innerHTML = message;
    alertBox.style.display = "block";
  }

  function resetButton() {
    btnSubmit.disabled = false;
    btnSubmit.innerText = "Simpan & Daftarkan Wajah";
  }

  window.addEventListener("DOMContentLoaded", loadModels);
</script>
</body>
</html>

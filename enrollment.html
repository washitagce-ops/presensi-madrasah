<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Wajah Siswa - Presensi Madrasah</title>
  <!-- CSS Bootstrap 5 untuk Tampilan Responsif -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Pustaka face-api.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .camera-container { position: relative; width: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; border-radius: 12px; background: #000; }
    video { width: 100%; height: auto; display: block; transform: scaleX(-1); /* Mirror view untuk kamera depan */ }
    canvas { position: absolute; top: 0; left: 0; }
    .status-badge { position: absolute; top: 10px; left: 10px; z-index: 10; }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white text-center py-3">
          <h4 class="mb-0">Pendaftaran Presensi Wajah</h4>
          <small>Sistem Presensi Siswa Madrasah</small>
        </div>
        <div class="card-body p-4">
          
          <!-- Area Kamera Video -->
          <div class="camera-container mb-3">
            <span id="cameraStatus" class="badge bg-warning text-dark status-badge">Memuat Model AI...</span>
            <video id="video" autoplay playsinline muted></video>
          </div>

          <!-- Form Input Data Siswa -->
          <form id="enrollForm">
            <div class="mb-3">
              <label for="nis" class="form-label font-weight-bold">NIS / NISN</label>
              <input type="number" class="form-control" id="nis" required placeholder="Masukkan NIS siswa">
            </div>
            
            <div class="mb-3">
              <label for="nama" class="form-label">Nama Lengkap Siswa</label>
              <input type="text" class="form-control" id="nama" required placeholder="Masukkan nama lengkap">
            </div>

            <div class="mb-3">
              <label for="kelas" class="form-label">Kelas</label>
              <input type="text" class="form-control" id="kelas" required placeholder="Contoh: VII-A, X-IPA-1">
            </div>

            <div class="mb-3">
              <label for="emailOrtu" class="form-label">Email Orang Tua</label>
              <input type="email" class="form-control" id="emailOrtu" required placeholder="email@gmail.com">
            </div>

            <div class="mb-3">
              <label for="waOrtu" class="form-label">Nomor WhatsApp Orang Tua</label>
              <input type="tel" class="form-control" id="waOrtu" required placeholder="628123456789">
              <div class="form-text">Gunakan format kode negara (contoh: 628123456789).</div>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-2" disabled>
              Proses Pendaftaran Wajah
            </button>
          </form>

          <!-- Area Notifikasi Status -->
          <div id="alertBox" class="mt-3" style="display: none;"></div>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // CONFIGURATION: Ganti URL dibawah ini dengan Web App URL dari Deployment Google Apps Script Tahap 1 Anda
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwRT4Bw2Z_d-P0TmxGSAZHSV3xncTjj9eC5sY8vo43apsWw-j-CUA6LT8IAUzm0l2HkQg/exec";
  
  // CDN Alamat Weights Model face-api.js
  const MODEL_URL = "https://justadudewhohacks.github.io/face-api.js/models";

  const video = document.getElementById("video");
  const cameraStatus = document.getElementById("cameraStatus");
  const btnSubmit = document.getElementById("btnSubmit");
  const alertBox = document.getElementById("alertBox");

  let faceDescriptor = null;

  // 1. Inisialisasi dan Memuat Model AI Face-API
  async function loadModels() {
    try {
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
      cameraStatus.className = "badge bg-info text-white status-badge";
      cameraStatus.innerText = "Mengaktifkan Kamera...";
      startVideo();
    } catch (err) {
      showAlert("danger", "Gagal memuat model AI: " + err.message);
    }
  }

  // 2. Mengaktifkan Kamera HP / Device
  function startVideo() {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
      .then(stream => {
        video.srcObject = stream;
        cameraStatus.className = "badge bg-success status-badge";
        cameraStatus.innerText = "Kamera Aktif";
        btnSubmit.disabled = false;
      })
      .catch(err => {
        showAlert("danger", "Akses kamera ditolak atau tidak tersedia: " + err.message);
      });
  }

  // 3. Proses Pendaftaran ketika Form Disubmit
  document.getElementById("enrollForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    btnSubmit.disabled = true;
    btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> Merekam Wajah...`;

    // Deteksi Wajah tunggal dari Video Frame
    const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

    if (!detection) {
      showAlert("warning", "Wajah tidak terdeteksi! Pastikan wajah siswa terlihat jelas dan cukup pencahayaan.");
      resetButton();
      return;
    }

    // Mengambil vektor descriptor wajah (128 nilai float)
    const descriptorArray = Array.from(detection.descriptor);

    const payload = {
      action: "enroll",
      nis: document.getElementById("nis").value,
      nama: document.getElementById("nama").value,
      kelas: document.getElementById("kelas").value,
      emailOrtu: document.getElementById("emailOrtu").value,
      waOrtu: document.getElementById("waOrtu").value,
      descriptors: descriptorArray
    };

    // Mengirimkan Data ke Google Apps Script
    try {
      btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> Menyimpan Data...`;
      
      const response = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === "success") {
        showAlert("success", result.message);
        document.getElementById("enrollForm").reset();
      } else {
        showAlert("danger", "Gagal mendaftar: " + result.message);
      }
    } catch (err) {
      showAlert("danger", "Kesalahan koneksi ke server: " + err.message);
    } finally {
      resetButton();
    }
  });

  function showAlert(type, message) {
    alertBox.className = `alert alert-${type}`;
    alertBox.innerText = message;
    alertBox.style.display = "block";
  }

  function resetButton() {
    btnSubmit.disabled = false;
    btnSubmit.innerText = "Proses Pendaftaran Wajah";
  }

  // Jalankan pemuatan model saat halaman selesai dimuat
  window.addEventListener("DOMContentLoaded", loadModels);
</script>
</body>
</html>
